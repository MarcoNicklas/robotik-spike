<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lehrkraftzugang · SPIKE Prime</title>
  <link rel="stylesheet" href="./styles.css?v=0dcd1bf77871">
    <script defer src="./simulation.js?v=0dcd1bf77871"></script>
    <script defer src="./aufgaben-vorlage.js?v=0dcd1bf77871"></script>
    <script defer src="./pruefungsdaten.js?v=0dcd1bf77871"></script>
    <script defer src="./pruefung.js?v=0dcd1bf77871"></script>
</head>
<body data-role="teacher">
  <header class="site-header"><div class="site-header-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Robotik · SPIKE Prime</span></div>
    <button data-lock type="button" hidden>Schließen</button>
  </div></header>
  <main><section class="gate" data-access-gate aria-labelledby="gate-title">
    <div class="gate-form">
      <h1 id="gate-title">Lehrkraftzugang</h1>
      
      <form class="access-form" data-access-form>
        <label for="access-code">Lehrkraft-Code</label>
        <div class="access-actions">
          <input id="access-code" type="password" spellcheck="false" autocapitalize="none" autocomplete="off" required maxlength="60">
          <button class="primary" type="submit">Öffnen</button>
        </div>
      </form>
      <p data-access-message class="notice" role="alert" hidden></p>
      <noscript>Zum Öffnen JavaScript aktivieren.</noscript>
    </div>
  </section>
  <div data-access-result hidden></div>
  <template data-teacher-template><section class="teacher-intro">
  <h1>Lehrkraftansicht</h1>
  <div class="teacher-actions">
    <a class="button" href="./index.html" target="_blank" rel="noopener">Schülerversion</a>
    <button type="button" data-copy-link>Schülerlink kopieren</button>
    <button class="primary" type="button" data-print>Drucken</button>
  </div>
  <p class="notice" data-teacher-feedback role="status" hidden></p>
</section>

<div class="teacher-grid">
  <section class="panel" aria-labelledby="setup-title">
    <h2 id="setup-title">Fahrmatte</h2>
    <ul class="setup-list">
      <li><strong>A</strong> in die Mitte des Startfelds, <strong>E</strong> in die Mitte des roten Felds.</li>
      <li><strong>B, C, D</strong> teilen A–E in vier gleich lange Abschnitte.</li>
      <li>Abschnittslänge messen und angeben. Drehfreiheit an allen Marken prüfen.</li>
    </ul>
  </section>
  <section class="panel" aria-labelledby="rubric-title">
    <h2 id="rubric-title">Bewertung · 10 Punkte</h2>
    <ul class="rubric">
      <li><span>Richtiges Hubwort am Start</span><strong>2</strong></li>
      <li><span>Vorwärts zur Zwischenmarke, dort 1 s Stillstand</span><strong>2</strong></li>
      <li><span>Rückwärts zur Endmarke, dort Halt</span><strong>2</strong></li>
      <li><span>90°-Drehung an der Endmarke im Stand, richtige Richtung</span><strong>2</strong></li>
      <li><span>Kurzer Hubton nach der Drehung</span><strong>2</strong></li>
    </ul>
    <p class="hint">0 fehlt · 1 teilweise erfüllt · 2 erfüllt</p>
  </section>
</div>

<section class="panel schedule" aria-labelledby="schedule-title">
  <h2 id="schedule-title">Prüfungsplan und Codes</h2>
  <div class="schedule-settings">
    <label>Beginn (optional)<input type="time" data-start-time></label>
    <label>Taktung<select data-schedule-mode>
      <option value="staggered">00, 05, 15, 20 …</option>
      <option value="continuous">Alle 5 Minuten</option>
    </select></label>
  </div>
  <p class="schedule-summary" data-schedule-summary></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="Prüfungsplan mit Aufgabencodes">
    <table>
      <thead><tr><th scope="col">Aufgabe</th><th scope="col">Code</th><th scope="col">Fahrt · Drehung</th><th scope="col">Wort</th><th scope="col">Code ausgeben</th><th scope="col">Vorführung</th></tr></thead>
      <tbody data-schedule-rows></tbody>
    </table>
  </div>
</section>
<dialog data-preview-dialog class="preview-dialog">
  <div class="preview-top"><button type="button" data-close-preview>Vorschau schließen</button></div>
  <div data-preview-content></div>
</dialog>
</template></main>
</body>
</html>
